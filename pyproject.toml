[project]
name = "bigtrooper-qr"
dynamic = [
    "version",
]
description = "BigTrooper QR: generate 3D printable QR code tags (STL, 3MF) and QR images (PNG, SVG) as a Python library"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZappaVinny" },
]
maintainers = [
    { name = "ZappaVinny" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "qr",
    "qrcode",
    "3d-printing",
    "stl",
    "3mf",
]
dependencies = [
    "qrcode[pil]>=8.2",
    "numpy-stl>=3.2.0",
    "scipy>=1.16.0",
    "lib3mf>=2.4.1",
    "pydantic>=2.11.0",
]
packages = [
    "src/bigtrooper_qr",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/ZappaVinny/bigtrooper-qr"
Documentation = "https://github.com/ZappaVinny/bigtrooper-qr/blob/main/LIBRARY.md"
Repository = "https://github.com/ZappaVinny/bigtrooper-qr"
Issues = "https://github.com/ZappaVinny/bigtrooper-qr/issues"

[build-system]
requires = [
    "hatchling",
    "wheel",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pyright>=1.1.402",
    "pre-commit>=4.2.0",
    "ruff>=0.12.1",
    "pytest>=8.3.0",
    "trimesh>=4.6.13",
]

[tool.hatch.version]
path = "src/bigtrooper_qr/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/bigtrooper_qr",
]
include = [
    "py.typed",
    "**/*.py",
    "**/*.html",
    "**/*.gif",
    "**/*.jpg",
    "**/*.png",
    "**/*.md",
    "**/*.tcss",
    "**/*.ttf",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/bigtrooper_qr",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    "*.so",
    "*.dylib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
